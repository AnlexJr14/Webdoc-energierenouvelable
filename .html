<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur Audio Vert</title>
    <style>
        /* --- CSS --- */
        :root {
            --primary-green: #00ff88; /* Vert Néon */
            --dark-green: #00b862;
            --bg-color: #1a1a1a;
            --player-bg: #2d2d2d;
            --text-color: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .audio-player {
            background-color: var(--player-bg);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 20px 30px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.1); /* Lueur verte subtile */
            display: flex;
            flex-direction: column;
            gap: 15px;
            color: var(--text-color);
        }

        /* Titre ou Info Piste */
        .track-info {
            text-align: center;
            margin-bottom: 10px;
        }
        .track-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-green);
            margin: 0;
        }
        .track-artist {
            font-size: 0.9rem;
            color: #aaa;
            margin: 5px 0 0 0;
        }

        /* Contrôles Principaux */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button#playBtn {
            background-color: var(--primary-green);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        button#playBtn:hover {
            transform: scale(1.05);
            background-color: var(--dark-green);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.5);
        }

        button#playBtn svg {
            fill: var(--player-bg); /* Icône foncée sur fond vert */
            width: 20px;
            height: 20px;
        }

        /* Barres de progression (Range Sliders) */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            background: #444;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        /* Couleur de la barre remplie (Astuce Webkit) */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--primary-green);
            cursor: pointer;
            transition: transform 0.1s;
            border: 2px solid var(--player-bg);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Zone de temps */
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #ccc;
            margin-top: -10px;
        }

        /* Zone Volume */
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }
        
        .volume-control svg {
            fill: var(--primary-green);
            width: 20px;
        }

    </style>
</head>
<body>

    <div class="audio-player">
        <div class="track-info">
            <h2 class="track-title">Mon Audio Vert</h2>
            <p class="track-artist">Artiste Inconnu</p>
        </div>

        <audio id="audio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

        <input type="range" id="progress" value="0" min="0" step="1">
        
        <div class="time-display">
            <span id="currentTime">00:00</span>
            <span id="duration">00:00</span>
        </div>

        <div class="controls">
            <div class="volume-control">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <input type="range" id="volume" value="1" min="0" max="1" step="0.1" style="width: 80px;">
            </div>

            <button id="playBtn">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
        </div>
    </div>

    <script>
        /* --- JAVASCRIPT --- */
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const volumeSlider = document.getElementById('volume');

        // 1. Gestion Lecture / Pause
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                toggleIcons(true);
            } else {
                audio.pause();
                toggleIcons(false);
            }
        });

        function toggleIcons(isPlaying) {
            if (isPlaying) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        }

        // 2. Mise à jour de la barre de progression et du temps
        audio.addEventListener('timeupdate', () => {
            const current = audio.currentTime;
            const duration = audio.duration;

            // Évite NaN si l'audio n'est pas encore chargé
            if (!isNaN(duration)) {
                progress.value = (current / duration) * 100;
                currentTimeEl.textContent = formatTime(current);
                durationEl.textContent = formatTime(duration);
            }
        });

        // 3. Permettre à l'utilisateur de changer le temps (Scrubbing)
        progress.addEventListener('input', () => {
            const duration = audio.duration;
            audio.currentTime = (progress.value / 100) * duration;
        });

        // 4. Gestion du Volume
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        // 5. Réinitialiser le bouton quand l'audio est fini
        audio.addEventListener('ended', () => {
            toggleIcons(false);
            progress.value = 0;
            audio.currentTime = 0;
        });

        // 6. Configurer la durée max au chargement des métadonnées
        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });

        // Fonction utilitaire pour formater le temps (secondes -> MM:SS)
        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
        }
    </script>
</body>
</html>
