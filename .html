

<style>
/* --- STYLE DU MINI-JEU --- */
.game-section {
    padding: 6rem 0;
    background: linear-gradient(to bottom, var(--light-color), #fff);
}

.game-card {
    max-width: 600px;
    margin: 0 auto;
    background: #ffffff;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    text-align: center;
    border: 2px solid var(--light-color);
    min-height: 300px; /* Évite que la boîte change trop de taille */
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

/* Écran d'accueil */
.game-icon {
    font-size: 3rem;
    color: var(--primary-color);
    margin-bottom: 20px;
}

.game-card h3 {
    font-size: 1.8rem;
    margin-bottom: 15px;
    color: var(--dark-color);
}

.game-card p {
    font-size: 1.1rem;
    color: #666;
    margin-bottom: 30px;
}

/* Boutons */
.btn-start, .btn-restart {
    background-color: var(--primary-color);
    color: white;
    border: none;
    padding: 12px 30px;
    font-size: 1.1rem;
    border-radius: 30px;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
    font-weight: bold;
}

.btn-start:hover, .btn-restart:hover {
    background-color: var(--secondary-color);
    transform: scale(1.05);
}

/* Question en cours */
.question-text {
    font-size: 1.4rem;
    font-weight: bold;
    margin-bottom: 30px;
    color: var(--dark-color);
    font-family: 'Playfair Display', serif;
}

.answers-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.btn-answer {
    padding: 20px;
    border: 2px solid #eee;
    background: white;
    border-radius: 12px;
    font-size: 1.2rem;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: bold;
    color: var(--dark-color);
}

.btn-answer:hover {
    border-color: var(--primary-color);
    background-color: #f9fdfa;
}

.btn-true { color: #2e5c46; } /* Vert */
.btn-false { color: #c0392b; } /* Rouge */

/* Feedback (Réponse affichée) */
.feedback-box {
    animation: fadeIn 0.3s ease;
}

.feedback-title {
    font-size: 1.5rem;
    margin-bottom: 10px;
    font-weight: bold;
}
.correct { color: #27ae60; }
.wrong { color: #c0392b; }

.feedback-desc {
    margin-bottom: 25px;
    line-height: 1.6;
}

.btn-next {
    background-color: var(--dark-color);
    color: white;
    border: none;
    padding: 10px 25px;
    border-radius: 5px;
    cursor: pointer;
}

/* Barre de progression */
.progress-game {
    position: absolute;
    top: 0; left: 0;
    height: 6px;
    background: var(--secondary-color);
    width: 0%;
    transition: width 0.3s;
}

</style>

<section class="game-section" id="game">
    <div class="container">
        <h2 class="section-title">Testez vos connaissances !</h2>
        
        <div id="solarGame" class="game-card">
            <div class="game-start-screen">
                <div class="game-icon"><i class="fas fa-gamepad"></i></div>
                <h3>Expert du solaire ou novice ?</h3>
                <p>Démêlez le vrai du faux en 4 questions rapides.</p>
                <button class="btn-start" onclick="startGame()">Commencer le Quiz</button>
            </div>
        </div>

    </div>
</section>


<script>
    /* --- DONNÉES DU JEU --- */
const questions = [
    {
        question: "Les panneaux solaires ne fonctionnent pas quand il pleut.",
        isTrue: false,
        explanation: "Faux ! Ils fonctionnent grâce à la luminosité, pas la chaleur. Même sous la pluie, ils produisent (bien que moins qu'en plein soleil)."
    },
    {
        question: "Un panneau solaire est recyclable à 95%.",
        isTrue: true,
        explanation: "Vrai ! Le verre, l'aluminium et le silicium se recyclent très bien grâce à la filière Soren en France."
    },
    {
        question: "Il faut environ 10 ans à un panneau pour 'rembourser' l'énergie utilisée pour le fabriquer.",
        isTrue: false,
        explanation: "Intox ! Il faut seulement 1 an (en Europe) pour qu'un panneau produise plus d'énergie qu'il n'en a fallu pour sa fabrication."
    },
    {
        question: "L'autoconsommation permet de réduire sa facture d'électricité de 30 à 50%.",
        isTrue: true,
        explanation: "C'est vrai. En consommant directement votre production, vous achetez moins au réseau, ce qui allège considérablement la facture."
    }
];

let currentQuestionIndex = 0;
let score = 0;

/* --- FONCTIONS DU JEU --- */

function startGame() {
    currentQuestionIndex = 0;
    score = 0;
    showQuestion();
}

function showQuestion() {
    const q = questions[currentQuestionIndex];
    const gameContainer = document.getElementById('solarGame');
    
    // Calcul barre de progression
    const progressPercent = (currentQuestionIndex / questions.length) * 100;

    gameContainer.innerHTML = `
        <div class="progress-game" style="width: ${progressPercent}%"></div>
        <div class="question-text">${q.question}</div>
        <div class="answers-grid">
            <button class="btn-answer btn-true" onclick="checkAnswer(true)">INFO (VRAI)</button>
            <button class="btn-answer btn-false" onclick="checkAnswer(false)">INTOX (FAUX)</button>
        </div>
        <p style="margin-top: 20px; font-size: 0.9rem; color: #aaa;">Question ${currentQuestionIndex + 1} / ${questions.length}</p>
    `;
}

function checkAnswer(userAnswer) {
    const q = questions[currentQuestionIndex];
    const isCorrect = (userAnswer === q.isTrue);
    
    if (isCorrect) score++;

    const gameContainer = document.getElementById('solarGame');
    
    // Affiche le résultat
    gameContainer.innerHTML = `
        <div class="feedback-box">
            <div class="feedback-title ${isCorrect ? 'correct' : 'wrong'}">
                ${isCorrect ? '<i class="fas fa-check-circle"></i> Bonne réponse !' : '<i class="fas fa-times-circle"></i> Oups, raté !'}
            </div>
            <p class="feedback-desc">${q.explanation}</p>
            <button class="btn-next" onclick="nextQuestion()">Suivant &rarr;</button>
        </div>
    `;
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    const gameContainer = document.getElementById('solarGame');
    let message = "";
    
    if (score === 4) message = "Incroyable ! Vous êtes un véritable expert du solaire.";
    else if (score >= 2) message = "Pas mal du tout ! Vous avez de bonnes bases.";
    else message = "C'est l'occasion de lire nos articles pour en apprendre plus !";

    gameContainer.innerHTML = `
        <h3>Quiz terminé !</h3>
        <div style="font-size: 3rem; font-weight: bold; color: var(--primary-color); margin: 20px 0;">
            ${score} / ${questions.length}
        </div>
        <p>${message}</p>
        <button class="btn-restart" onclick="startGame()">Rejouer</button>
    `;
}
</script>
